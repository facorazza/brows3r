[package]
name = "brows3r"
version = "0.1.0"
edition = "2024"

[features]
default = []
ldap = ["ldap3"]

[dependencies]
# Web framework
axum = { version = "0.8.8", features = ["macros", "multipart"] }
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.7.0", features = [
    "fs",
    "trace",
    "compression-gzip",
] }
tower-sessions = { version = "0.14.0", features = ["signed"] }
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }

# Templating
askama = { version = "0.16.0" }

# Database
sqlx = { version = "0.8.6", features = [
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
    "chrono",
] }

# S3
aws-config = { version = "1.8.12", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.143.0", default-features = false, features = [
    "behavior-version-latest",
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# Metrics
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"

# Environment
dotenvy = "0.15.7"

# Error handling
anyhow = "1.0.100"

# LDAP (optional feature)
ldap3 = { version = "0.12.1", optional = true }

# Password hashing
argon2 = "0.5.3"

# Time
chrono = { version = "0.4.42", features = ["serde"] }
time = "0.3"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
axum-test = "21.0.0"
sqlx = { version = "0.8.6", features = ["sqlite"] }
tower-sessions-sqlx-store = { version = "0.15.0", features = ["sqlite"] }